<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Quantum Landscape world map">
  <defs>
    <linearGradient id="qbgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1fb"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <radialGradient id="qhaloL" cx="0.52" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2E7CFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qlineL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15D5FF"/>
      <stop offset="0.5" stop-color="#2E7CFF"/>
      <stop offset="1" stop-color="#8A5CF6"/>
    </linearGradient>
    <filter id="qpinGlowL" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#1f3a8a" flood-opacity="0.3"/>
    </filter>
    <g id="qpinL"><path d="M0 0 L-5.5 -10 A6.5 6.5 0 1 1 5.5 -10 Z"/></g>
  </defs>

  <rect width="640" height="400" fill="url(#qbgL)"/>
  <rect width="640" height="400" fill="url(#qhaloL)"/>

  <!-- graticule -->
  <g stroke="#2E7CFF" stroke-opacity="0.12" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="0" y1="80" x2="640" y2="80"/><line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/><line x1="0" y1="320" x2="640" y2="320"/>
  </g>

  <!-- continents (soft blobs) -->
  <g fill="#2E7CFF">
    <g opacity="0.14"><ellipse cx="120" cy="150" rx="56" ry="44"/><ellipse cx="92" cy="118" rx="30" ry="24"/><ellipse cx="152" cy="176" rx="26" ry="30"/></g>
    <g opacity="0.12"><ellipse cx="182" cy="262" rx="26" ry="48"/><ellipse cx="172" cy="304" rx="18" ry="28"/></g>
    <g opacity="0.14"><ellipse cx="312" cy="134" rx="30" ry="24"/></g>
    <g opacity="0.12"><ellipse cx="346" cy="224" rx="38" ry="54"/><ellipse cx="356" cy="188" rx="28" ry="24"/></g>
    <g opacity="0.14"><ellipse cx="462" cy="150" rx="74" ry="54"/><ellipse cx="420" cy="126" rx="30" ry="24"/><ellipse cx="504" cy="176" rx="30" ry="28"/></g>
    <g opacity="0.12"><ellipse cx="526" cy="286" rx="30" ry="22"/></g>
  </g>

  <!-- academic-lineage connections -->
  <g fill="none" stroke="url(#qlineL)" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round">
    <path d="M110 150 Q 210 66 305 132"/>
    <path d="M312 146 Q 380 118 445 150"/>
    <path d="M110 150 Q 150 212 175 255"/>
    <path d="M305 132 Q 332 178 350 212"/>
    <path d="M445 150 Q 504 212 520 278"/>
  </g>

  <!-- research-hub pins -->
  <g filter="url(#qpinGlowL)">
    <use href="#qpinL" x="110" y="150" fill="#15D5FF"/>
    <use href="#qpinL" x="140" y="138" fill="#2E7CFF"/>
    <use href="#qpinL" x="92"  y="172" fill="#6E8CFF"/>
    <use href="#qpinL" x="305" y="132" fill="#15D5FF"/>
    <use href="#qpinL" x="322" y="126" fill="#8A5CF6"/>
    <use href="#qpinL" x="312" y="148" fill="#2E7CFF"/>
    <use href="#qpinL" x="296" y="152" fill="#6E8CFF"/>
    <use href="#qpinL" x="332" y="142" fill="#15D5FF"/>
    <use href="#qpinL" x="445" y="150" fill="#2E7CFF"/>
    <use href="#qpinL" x="470" y="162" fill="#8A5CF6"/>
    <use href="#qpinL" x="492" y="146" fill="#15D5FF"/>
    <use href="#qpinL" x="175" y="255" fill="#6E8CFF"/>
    <use href="#qpinL" x="350" y="212" fill="#2E7CFF"/>
    <use href="#qpinL" x="520" y="278" fill="#8A5CF6"/>
  </g>

  <!-- filter dock hint -->
  <g>
    <rect x="22" y="300" width="120" height="76" rx="13" fill="#ffffff" fill-opacity="0.75" stroke="#2E7CFF" stroke-opacity="0.25"/>
    <circle cx="40" cy="322" r="5" fill="#15D5FF"/><rect x="52" y="318" width="74" height="7" rx="3.5" fill="#516178" fill-opacity="0.4"/>
    <circle cx="40" cy="340" r="5" fill="#2E7CFF"/><rect x="52" y="336" width="58" height="7" rx="3.5" fill="#516178" fill-opacity="0.4"/>
    <circle cx="40" cy="358" r="5" fill="#8A5CF6"/><rect x="52" y="354" width="66" height="7" rx="3.5" fill="#516178" fill-opacity="0.4"/>
  </g>
</svg>
