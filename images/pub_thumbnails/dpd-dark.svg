<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Acousto-optic modulator with intermodulation spectrum">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#041025"/><stop offset="1" stop-color="#020a18"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.18"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#7c8cff" stroke-opacity="0.08" stroke-width="1"/></pattern>
    <filter id="glowC" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#15D5FF" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <!-- AOM crystal -->
  <rect x="150" y="120" width="56" height="150" rx="6" fill="#06122a" stroke="#9fb0ff" stroke-width="2.4" filter="url(#glowC)"/>
  <rect x="158" y="262" width="40" height="12" rx="3" fill="none" stroke="#9fb0ff" stroke-width="2"/>
  <!-- incoming laser -->
  <line x1="40" y1="180" x2="150" y2="180" stroke="#15D5FF" stroke-width="3.2" filter="url(#glowC)"/>
  <!-- diffracted orders out -->
  <line x1="206" y1="185" x2="330" y2="140" stroke="#15D5FF" stroke-width="3.2" filter="url(#glowC)"/>
  <line x1="206" y1="180" x2="320" y2="200" stroke="#62f0ff" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <text x="214" y="128" fill="#62f0ff" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">1st order</text>
  <!-- multi-tone RF drive in -->
  <path d="M178 392 Q 188 372 178 352 Q 168 332 178 312 L178 274" fill="none" stroke="#8A5CF6" stroke-width="2.4"/>
  <text x="116" y="352" fill="#8A5CF6" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">RF tones</text>

  <!-- output spectrum: wanted tones tall, intermodulation tones small / suppressed -->
  <g stroke-linecap="round">
    <line x1="360" y1="300" x2="608" y2="300" stroke="#9fb0ff" stroke-width="2" stroke-opacity="0.45"/>
    <!-- wanted tones -->
    <line x1="400" y1="300" x2="400" y2="150" stroke="#15D5FF" stroke-width="6" filter="url(#glowC)"/>
    <line x1="470" y1="300" x2="470" y2="135" stroke="#15D5FF" stroke-width="6" filter="url(#glowC)"/>
    <line x1="540" y1="300" x2="540" y2="158" stroke="#15D5FF" stroke-width="6" filter="url(#glowC)"/>
    <!-- intermodulation tones (suppressed) -->
    <line x1="435" y1="300" x2="435" y2="258" stroke="#8A5CF6" stroke-width="5" stroke-opacity="0.55" stroke-dasharray="3 4"/>
    <line x1="505" y1="300" x2="505" y2="250" stroke="#8A5CF6" stroke-width="5" stroke-opacity="0.55" stroke-dasharray="3 4"/>
    <line x1="575" y1="300" x2="575" y2="272" stroke="#8A5CF6" stroke-width="5" stroke-opacity="0.55" stroke-dasharray="3 4"/>
    <line x1="365" y1="300" x2="365" y2="276" stroke="#8A5CF6" stroke-width="5" stroke-opacity="0.55" stroke-dasharray="3 4"/>
  </g>
  <text x="392" y="334" fill="#9fb0ff" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">frequency</text>
</svg>
