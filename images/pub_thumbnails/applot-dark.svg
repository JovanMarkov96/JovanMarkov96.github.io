<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Neutral kaon decaying into two pions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#041025"/><stop offset="1" stop-color="#020a18"/></linearGradient>
    <radialGradient id="halo" cx="0.46" cy="0.5" r="0.6"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.18"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#7c8cff" stroke-opacity="0.08" stroke-width="1"/></pattern>
    <filter id="glowC" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#15D5FF" flood-opacity="0.55"/></filter>
    <filter id="glowV" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#8A5CF6" flood-opacity="0.6"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <!-- faint detector arcs -->
  <g fill="none" stroke="#6E8CFF" stroke-opacity="0.16" stroke-width="1.5">
    <path d="M300 210 m -250 0 a 250 250 0 0 1 500 0"/>
    <path d="M300 210 m -180 0 a 180 180 0 0 1 360 0"/>
    <path d="M300 210 m -110 0 a 110 110 0 0 1 220 0"/>
  </g>

  <!-- incoming neutral kaon (no charge: dashed, leaves no track) -->
  <line x1="46" y1="210" x2="292" y2="210" stroke="#9fb0ff" stroke-width="2.6" stroke-dasharray="7 7"/>
  <path d="M280 203 L294 210 L280 217" fill="none" stroke="#9fb0ff" stroke-width="2.6"/>
  <text x="92" y="196" fill="#9fb0ff" font-family="Inter, 'Segoe UI', sans-serif" font-size="22" font-weight="700">K⁰</text>

  <!-- decay vertex -->
  <circle cx="300" cy="210" r="6" fill="#f7fbff"/>

  <!-- two pion tracks curving apart in the field -->
  <path d="M300 210 Q 440 150 596 96" fill="none" stroke="#15D5FF" stroke-width="3.2" stroke-linecap="round" filter="url(#glowC)"/>
  <path d="M300 210 Q 440 270 596 324" fill="none" stroke="#8A5CF6" stroke-width="3.2" stroke-linecap="round" filter="url(#glowV)"/>
  <text x="556" y="86" fill="#15D5FF" font-family="Inter, 'Segoe UI', sans-serif" font-size="22" font-weight="700">π⁺</text>
  <text x="556" y="344" fill="#8A5CF6" font-family="Inter, 'Segoe UI', sans-serif" font-size="22" font-weight="700">π⁻</text>

  <!-- Armenteros-Podolanski parabola (signature plot) -->
  <g opacity="0.7">
    <path d="M384 360 Q 460 300 536 360" fill="none" stroke="#6E8CFF" stroke-width="2.2"/>
    <line x1="372" y1="360" x2="548" y2="360" stroke="#6E8CFF" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
</svg>
