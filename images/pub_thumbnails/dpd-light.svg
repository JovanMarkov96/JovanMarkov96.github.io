<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Acousto-optic modulator with intermodulation spectrum">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1fb"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.10"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#2E7CFF" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#2E7CFF" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <rect x="150" y="120" width="56" height="150" rx="6" fill="#ffffff" stroke="#3a55d8" stroke-width="2.4" filter="url(#soft)"/>
  <rect x="158" y="262" width="40" height="12" rx="3" fill="none" stroke="#3a55d8" stroke-width="2"/>
  <line x1="40" y1="180" x2="150" y2="180" stroke="#0aa7c9" stroke-width="3.2" filter="url(#soft)"/>
  <line x1="206" y1="185" x2="330" y2="140" stroke="#0aa7c9" stroke-width="3.2" filter="url(#soft)"/>
  <line x1="206" y1="180" x2="320" y2="200" stroke="#0aa7c9" stroke-width="2" stroke-dasharray="6 6" opacity="0.55"/>
  <text x="214" y="128" fill="#2E7CFF" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">1st order</text>
  <path d="M178 392 Q 188 372 178 352 Q 168 332 178 312 L178 274" fill="none" stroke="#8A5CF6" stroke-width="2.4"/>
  <text x="116" y="352" fill="#8A5CF6" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">RF tones</text>

  <g stroke-linecap="round">
    <line x1="360" y1="300" x2="608" y2="300" stroke="#3a55d8" stroke-width="2" stroke-opacity="0.45"/>
    <line x1="400" y1="300" x2="400" y2="150" stroke="#2E7CFF" stroke-width="6" filter="url(#soft)"/>
    <line x1="470" y1="300" x2="470" y2="135" stroke="#2E7CFF" stroke-width="6" filter="url(#soft)"/>
    <line x1="540" y1="300" x2="540" y2="158" stroke="#2E7CFF" stroke-width="6" filter="url(#soft)"/>
    <line x1="435" y1="300" x2="435" y2="258" stroke="#8A5CF6" stroke-width="5" stroke-opacity="0.6" stroke-dasharray="3 4"/>
    <line x1="505" y1="300" x2="505" y2="250" stroke="#8A5CF6" stroke-width="5" stroke-opacity="0.6" stroke-dasharray="3 4"/>
    <line x1="575" y1="300" x2="575" y2="272" stroke="#8A5CF6" stroke-width="5" stroke-opacity="0.6" stroke-dasharray="3 4"/>
    <line x1="365" y1="300" x2="365" y2="276" stroke="#8A5CF6" stroke-width="5" stroke-opacity="0.6" stroke-dasharray="3 4"/>
  </g>
  <text x="392" y="334" fill="#3a55d8" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">frequency</text>
</svg>
