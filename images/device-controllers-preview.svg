<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Lab Instrument Controllers blueprint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1838"/>
      <stop offset="1" stop-color="#050b1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#5b6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glow)"/>

  <!-- blueprint grid -->
  <g stroke="#7c8cff" stroke-opacity="0.10" stroke-width="1">
    <g>
      <line x1="40" y1="0" x2="40" y2="400"/><line x1="80" y1="0" x2="80" y2="400"/>
      <line x1="120" y1="0" x2="120" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
      <line x1="200" y1="0" x2="200" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/>
      <line x1="280" y1="0" x2="280" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
      <line x1="360" y1="0" x2="360" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
      <line x1="440" y1="0" x2="440" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/>
      <line x1="520" y1="0" x2="520" y2="400"/><line x1="560" y1="0" x2="560" y2="400"/>
      <line x1="600" y1="0" x2="600" y2="400"/>
    </g>
    <g>
      <line x1="0" y1="40" x2="640" y2="40"/><line x1="0" y1="80" x2="640" y2="80"/>
      <line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="160" x2="640" y2="160"/>
      <line x1="0" y1="200" x2="640" y2="200"/><line x1="0" y1="240" x2="640" y2="240"/>
      <line x1="0" y1="280" x2="640" y2="280"/><line x1="0" y1="320" x2="640" y2="320"/>
      <line x1="0" y1="360" x2="640" y2="360"/>
    </g>
  </g>

  <!-- instrument glyphs (blueprint line art) -->
  <g fill="none" stroke="#9fb0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85">
    <!-- oscilloscope -->
    <g transform="translate(64,150)">
      <rect x="0" y="0" width="150" height="92" rx="8"/>
      <rect x="12" y="12" width="86" height="60" rx="3" stroke-opacity="0.6"/>
      <path d="M12 42 C 24 18, 36 66, 48 42 S 74 18, 86 42" stroke="#62f0ff"/>
      <circle cx="124" cy="28" r="12"/><circle cx="124" cy="62" r="8"/>
    </g>
    <!-- spectrum analyzer -->
    <g transform="translate(246,150)">
      <rect x="0" y="0" width="150" height="92" rx="8"/>
      <line x1="12" y1="72" x2="110" y2="72" stroke-opacity="0.6"/>
      <path d="M12 70 L40 66 L58 40 L64 22 L70 40 L92 68 L110 70" stroke="#62f0ff"/>
      <circle cx="128" cy="30" r="11"/>
    </g>
    <!-- modular mainframe -->
    <g transform="translate(428,150)">
      <rect x="0" y="0" width="150" height="92" rx="8"/>
      <rect x="14" y="12" width="20" height="68" rx="2" stroke-opacity="0.7"/>
      <rect x="42" y="12" width="20" height="68" rx="2" stroke-opacity="0.7"/>
      <rect x="70" y="12" width="20" height="68" rx="2" stroke-opacity="0.7"/>
      <rect x="98" y="12" width="20" height="68" rx="2" stroke-opacity="0.7"/>
      <circle cx="24" cy="66" r="4"/><circle cx="52" cy="66" r="4"/>
      <circle cx="80" cy="66" r="4"/><circle cx="108" cy="66" r="4"/>
    </g>
  </g>

  <!-- title -->
  <text x="48" y="74" fill="#f1f5ff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Lab Instrument Controllers</text>
  <text x="48" y="104" fill="#8fa0d8" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="500">Open-source Python drivers &amp; GUIs &#183; organised by vendor</text>
</svg>
