<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Physics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#041025"/><stop offset="1" stop-color="#020a18"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.2"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#7c8cff" stroke-opacity="0.08" stroke-width="1"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#15D5FF" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <!-- central atom: three electron orbits + nucleus -->
  <g filter="url(#glow)" fill="none" stroke-width="2.4">
    <ellipse cx="232" cy="214" rx="92" ry="34" stroke="#15D5FF" transform="rotate(28 232 214)"/>
    <ellipse cx="232" cy="214" rx="92" ry="34" stroke="#6E8CFF" transform="rotate(-28 232 214)"/>
    <ellipse cx="232" cy="214" rx="92" ry="34" stroke="#8A5CF6" transform="rotate(90 232 214)"/>
  </g>
  <circle cx="232" cy="214" r="11" fill="#15D5FF" filter="url(#glow)"/>
  <circle cx="314" cy="190" r="6" fill="#8A5CF6"/>
  <circle cx="156" cy="250" r="6" fill="#62f0ff"/>

  <!-- de Broglie / EM wave -->
  <path d="M392 328 Q 418 296 444 328 T 496 328 T 548 328 T 600 328" fill="none" stroke="#62f0ff" stroke-width="2.4" stroke-opacity="0.8"/>

  <g font-family="Inter, 'Segoe UI', sans-serif" font-weight="700" font-style="italic">
    <!-- Newton's 2nd law (classical mechanics) -->
    <text x="138" y="116" fill="#8A5CF6" font-size="28" filter="url(#glow)">F = ma</text>
    <!-- Schrodinger equation (quantum mechanics) -->
    <text x="356" y="120" fill="#9fb0ff" font-size="27" filter="url(#glow)">i&#8463; &#8706;&#968;/&#8706;t = &#292;&#968;</text>
    <!-- relativistic energy-momentum relation -->
    <text x="406" y="190" fill="#15D5FF" font-size="27" filter="url(#glow)">E&#178; = (pc)&#178; + (mc&#178;)&#178;</text>
    <!-- Gauss's law (electromagnetism) -->
    <text x="404" y="248" fill="#6E8CFF" font-size="25" filter="url(#glow)">&#8711;&#183;E = &#961;/&#949;&#8320;</text>
    <!-- Boltzmann entropy (statistical mechanics) -->
    <text x="120" y="332" fill="#62f0ff" font-size="26" filter="url(#glow)">S = k<tspan dy="6" font-size="17" font-style="normal">B</tspan><tspan dy="-6"> ln &#937;</tspan></text>
  </g>
</svg>
