<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Mathematics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1fb"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.10"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#2E7CFF" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#2E7CFF" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <g stroke="#2E7CFF" stroke-width="1.4" stroke-opacity="0.28">
    <line x1="150" y1="210" x2="300" y2="120"/><line x1="300" y1="120" x2="470" y2="170"/>
    <line x1="150" y1="210" x2="250" y2="300"/><line x1="250" y1="300" x2="430" y2="300"/>
    <line x1="470" y1="170" x2="430" y2="300"/><line x1="300" y1="120" x2="250" y2="300"/>
  </g>

  <g font-family="Inter, 'Segoe UI', sans-serif" font-weight="700" filter="url(#soft)">
    <text x="120" y="232" fill="#2E7CFF" font-size="84">&#8747;</text>
    <text x="276" y="138" fill="#4a5fd0" font-size="54">&#8721;</text>
    <text x="442" y="186" fill="#8A5CF6" font-size="46">&#960;</text>
    <text x="224" y="318" fill="#0aa7c9" font-size="46">&#8730;</text>
    <text x="406" y="316" fill="#4a5fd0" font-size="44">&#8734;</text>
    <text x="338" y="246" fill="#2E7CFF" font-size="34">&#8706;</text>
    <text x="486" y="288" fill="#8A5CF6" font-size="30" font-style="italic">d&#119909;</text>
    <text x="150" y="150" fill="#3a55d8" font-size="26" font-style="italic">e&#8305;&#960;+1=0</text>
    <text x="360" y="120" fill="#3a55d8" font-size="28">&#955;</text>
    <text x="520" y="232" fill="#0aa7c9" font-size="30">&#952;</text>
