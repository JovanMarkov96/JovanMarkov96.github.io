<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Quantum information toolbox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1fb"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.10"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#2E7CFF" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#2E7CFF" flood-opacity="0.18"/></filter>
    <marker id="vtip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A5CF6"/></marker>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <!-- ===== Bloch sphere ===== -->
  <g>
    <circle cx="186" cy="222" r="106" fill="#ffffff" fill-opacity="0.45" stroke="#2E7CFF" stroke-width="2.4" filter="url(#soft)"/>
    <ellipse cx="186" cy="222" rx="106" ry="33" fill="none" stroke="#4a5fd0" stroke-width="1.8" stroke-opacity="0.7"/>
    <ellipse cx="186" cy="222" rx="33" ry="106" fill="none" stroke="#4a5fd0" stroke-width="1.8" stroke-opacity="0.45"/>
    <line x1="186" y1="116" x2="186" y2="328" stroke="#3a55d8" stroke-width="1.6" stroke-opacity="0.55"/>
    <!-- state vector -->
    <line x1="186" y1="222" x2="248" y2="150" stroke="#8A5CF6" stroke-width="3" marker-end="url(#vtip)" filter="url(#soft)"/>
    <circle cx="186" cy="222" r="4" fill="#3a55d8"/>
    <text x="170" y="108" font-family="Inter, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#2E7CFF">|0&#10217;</text>
    <text x="170" y="352" font-family="Inter, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#2E7CFF">|1&#10217;</text>
    <text x="252" y="146" font-family="Inter, 'Segoe UI', sans-serif" font-size="22" font-weight="700" font-style="italic" fill="#8A5CF6">|&#968;&#10217;</text>
  </g>

  <!-- ===== qubit state ===== -->
  <text x="300" y="64" font-family="Inter, 'Segoe UI', sans-serif" font-size="26" font-weight="700" font-style="italic" fill="#3a55d8" filter="url(#soft)">|&#968;&#10217; = &#945;|0&#10217; + &#946;|1&#10217;</text>

  <!-- ===== neutral atom ===== -->
  <g filter="url(#soft)">
    <ellipse cx="500" cy="132" rx="56" ry="20" fill="none" stroke="#2E7CFF" stroke-width="2.2" transform="rotate(25 500 132)"/>
    <ellipse cx="500" cy="132" rx="56" ry="20" fill="none" stroke="#0aa7c9" stroke-width="2.2" transform="rotate(-25 500 132)"/>
    <circle cx="500" cy="132" r="8" fill="#2E7CFF"/>
    <circle cx="548" cy="120" r="5" fill="#8A5CF6"/>
  </g>
  <text x="468" y="178" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#3a55d8">neutral atom</text>

  <!-- ===== density matrix ===== -->
  <g font-family="Inter, 'Segoe UI', sans-serif" font-weight="700" filter="url(#soft)">
    <text x="378" y="244" font-size="24" font-style="italic" fill="#4a5fd0">&#961; =</text>
    <text x="424" y="244" font-size="22" fill="#4a5fd0">&#189;</text>
  </g>
  <g stroke="#4a5fd0" stroke-width="2" fill="none">
    <path d="M452 218 h-7 v52 h7"/>
    <path d="M520 218 h7 v52 h-7"/>
  </g>
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#2E7CFF">
    <text x="462" y="238">1</text><text x="498" y="238">1</text>
    <text x="462" y="264">1</text><text x="498" y="264">1</text>
  </g>
  <text x="430" y="292" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#3a55d8">density matrix</text>

  <!-- ===== transmon (capacitor || Josephson junction) ===== -->
  <g stroke="#3a55d8" stroke-width="2.4" fill="none" filter="url(#soft)">
    <!-- loop wires -->
    <path d="M430 322 H516"/>
    <path d="M430 372 H516"/>
    <!-- left branch: capacitor -->
    <line x1="430" y1="322" x2="430" y2="340"/>
    <line x1="416" y1="340" x2="444" y2="340"/>
    <line x1="416" y1="350" x2="444" y2="350"/>
    <line x1="430" y1="350" x2="430" y2="372"/>
    <!-- right branch: Josephson junction (box with X) -->
    <line x1="516" y1="322" x2="516" y2="335"/>
    <rect x="503" y="335" width="26" height="22" rx="2" fill="#ffffff"/>
    <line x1="503" y1="335" x2="529" y2="357"/>
    <line x1="529" y1="335" x2="503" y2="357"/>
    <line x1="516" y1="357" x2="516" y2="372"/>
  </g>
  <text x="452" y="392" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#3a55d8">transmon</text>
</svg>
