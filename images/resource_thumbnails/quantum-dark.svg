<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Quantum processor chip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#041025"/><stop offset="1" stop-color="#020a18"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.2"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#7c8cff" stroke-opacity="0.08" stroke-width="1"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#15D5FF" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <!-- bond pads + traces -->
  <g stroke="#9fb0ff" stroke-width="2" stroke-opacity="0.55">
    <line x1="250" y1="150" x2="150" y2="150"/><line x1="250" y1="290" x2="150" y2="290"/>
    <line x1="390" y1="150" x2="490" y2="150"/><line x1="390" y1="290" x2="490" y2="290"/>
    <line x1="320" y1="150" x2="320" y2="78"/><line x1="320" y1="290" x2="320" y2="346"/>
  </g>
  <g fill="#06122a" stroke="#9fb0ff" stroke-width="2">
    <rect x="128" y="142" width="18" height="16" rx="2"/><rect x="128" y="282" width="18" height="16" rx="2"/>
    <rect x="494" y="142" width="18" height="16" rx="2"/><rect x="494" y="282" width="18" height="16" rx="2"/>
    <rect x="311" y="62" width="18" height="16" rx="2"/><rect x="311" y="346" width="18" height="16" rx="2"/>
  </g>

  <!-- chip die -->
  <rect x="196" y="100" width="248" height="200" rx="20" fill="#06122a" stroke="#9fb0ff" stroke-width="2.6" filter="url(#glow)"/>

  <!-- qubit lattice + couplings -->
  <g stroke="#15D5FF" stroke-width="2.4" stroke-opacity="0.8">
    <line x1="250" y1="150" x2="390" y2="150"/><line x1="250" y1="220" x2="390" y2="220"/><line x1="250" y1="290" x2="390" y2="290"/>
    <line x1="250" y1="150" x2="250" y2="290"/><line x1="320" y1="150" x2="320" y2="290"/><line x1="390" y1="150" x2="390" y2="290"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="250" cy="150" r="13" fill="#06122a" stroke="#15D5FF" stroke-width="2.6"/><circle cx="390" cy="150" r="13" fill="#06122a" stroke="#15D5FF" stroke-width="2.6"/>
    <circle cx="250" cy="290" r="13" fill="#06122a" stroke="#15D5FF" stroke-width="2.6"/><circle cx="390" cy="290" r="13" fill="#06122a" stroke="#15D5FF" stroke-width="2.6"/>
    <circle cx="250" cy="220" r="13" fill="#06122a" stroke="#15D5FF" stroke-width="2.6"/><circle cx="390" cy="220" r="13" fill="#06122a" stroke="#15D5FF" stroke-width="2.6"/>
    <circle cx="320" cy="150" r="13" fill="#06122a" stroke="#15D5FF" stroke-width="2.6"/><circle cx="320" cy="290" r="13" fill="#06122a" stroke="#15D5FF" stroke-width="2.6"/>
    <circle cx="320" cy="220" r="17" fill="#06122a" stroke="#8A5CF6" stroke-width="3"/><circle cx="320" cy="220" r="6" fill="#8A5CF6"/>
  </g>
</svg>
