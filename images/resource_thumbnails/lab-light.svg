<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="AMO optics beamline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1fb"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.10"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#2E7CFF" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#2E7CFF" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <g stroke="#0aa7c9" stroke-width="3" stroke-linecap="round" filter="url(#soft)">
    <line x1="118" y1="250" x2="430" y2="250"/>
    <line x1="430" y1="250" x2="430" y2="120"/>
  </g>

  <g fill="#ffffff" stroke="#3a55d8" stroke-width="2.4" filter="url(#soft)">
    <rect x="58" y="232" width="60" height="36" rx="5"/>
  </g>
  <line x1="70" y1="250" x2="106" y2="250" stroke="#8A5CF6" stroke-width="3"/>
  <text x="58" y="296" fill="#3a55d8" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">laser</text>

  <g stroke="#3a55d8" stroke-width="2.4" fill="#ffffff" filter="url(#soft)">
    <path d="M214 214 Q 232 250 214 286 Q 196 250 214 214 Z"/>
  </g>

  <line x1="412" y1="268" x2="448" y2="232" stroke="#3a55d8" stroke-width="4" stroke-linecap="round" filter="url(#soft)"/>

  <g>
    <circle cx="430" cy="104" r="22" fill="none" stroke="#8A5CF6" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="424" cy="100" r="4" fill="#2E7CFF"/><circle cx="436" cy="106" r="4" fill="#6E8CFF"/>
    <circle cx="430" cy="112" r="4" fill="#8A5CF6"/><circle cx="438" cy="96" r="3" fill="#0aa7c9"/>
  </g>
  <text x="464" y="110" fill="#3a55d8" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">atoms</text>

  <g stroke="#4a5fd0" stroke-width="2" stroke-opacity="0.4">
    <line x1="214" y1="286" x2="214" y2="320"/><line x1="430" y1="284" x2="430" y2="320"/>
  </g>
</svg>
