<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="PDH laser-locking beamline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1fb"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.10"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#2E7CFF" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#2E7CFF" flood-opacity="0.2"/></filter>
    <marker id="fbtip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A5CF6"/></marker>
    <marker id="sigtip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a55d8"/></marker>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <!-- ===== beam path ===== -->
  <g stroke="#0aa7c9" stroke-width="3" stroke-linecap="round" filter="url(#soft)">
    <line x1="116" y1="150" x2="250" y2="150"/>      <!-- laser -> EOM -> BS -->
    <line x1="270" y1="150" x2="358" y2="150"/>      <!-- BS -> cavity -->
    <line x1="258" y1="168" x2="258" y2="276"/>      <!-- pick-off down to PD -->
  </g>

  <!-- intracavity standing-wave mode -->
  <path d="M366 150 Q 379 133 392 150 T 418 150 T 444 150 T 468 150" fill="none" stroke="#8A5CF6" stroke-width="2.4" stroke-opacity="0.9"/>

  <!-- ===== laser ===== -->
  <g fill="#ffffff" stroke="#3a55d8" stroke-width="2.4" filter="url(#soft)">
    <rect x="50" y="131" width="64" height="38" rx="5"/>
  </g>
  <line x1="62" y1="150" x2="102" y2="150" stroke="#8A5CF6" stroke-width="3"/>
  <text x="58" y="120" fill="#3a55d8" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">laser</text>

  <!-- ===== EOM (phase modulator) ===== -->
  <g fill="#ffffff" stroke="#3a55d8" stroke-width="2.2" filter="url(#soft)">
    <rect x="158" y="135" width="38" height="30" rx="3"/>
  </g>
  <text x="160" y="120" fill="#3a55d8" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">EOM</text>

  <!-- ===== beam splitter ===== -->
  <line x1="248" y1="138" x2="268" y2="162" stroke="#3a55d8" stroke-width="3" stroke-linecap="round" filter="url(#soft)"/>

  <!-- ===== optical cavity (two concave mirrors) ===== -->
  <g stroke="#3a55d8" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M364 122 Q 350 150 364 178"/>
    <path d="M470 122 Q 484 150 470 178"/>
  </g>
  <text x="386" y="206" fill="#3a55d8" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">cavity</text>

  <!-- ===== photodiode ===== -->
  <g filter="url(#soft)">
    <circle cx="258" cy="296" r="16" fill="#ffffff" stroke="#3a55d8" stroke-width="2.4"/>
    <path d="M250 288 H266 L258 302 Z" fill="#3a55d8"/>
    <line x1="250" y1="302" x2="266" y2="302" stroke="#3a55d8" stroke-width="2.4"/>
  </g>
  <text x="280" y="301" fill="#3a55d8" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">PD</text>

  <!-- ===== error signal: PD -> servo ===== -->
  <line x1="238" y1="304" x2="158" y2="330" stroke="#3a55d8" stroke-width="2.2" stroke-opacity="0.8" marker-end="url(#sigtip)"/>

  <!-- ===== PDH servo ===== -->
  <g fill="#ffffff" stroke="#3a55d8" stroke-width="2.4" filter="url(#soft)">
    <rect x="46" y="312" width="108" height="44" rx="6"/>
  </g>
  <!-- dispersive PDH error curve inside servo -->
  <path d="M58 340 q 10 -16 20 0 q 10 16 20 0" fill="none" stroke="#0aa7c9" stroke-width="2.2"/>
  <text x="104" y="339" fill="#3a55d8" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700">PDH</text>
  <text x="104" y="352" fill="#3a55d8" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700">lock</text>

  <!-- ===== feedback: servo -> laser ===== -->
  <line x1="82" y1="312" x2="82" y2="171" stroke="#8A5CF6" stroke-width="2.4" stroke-opacity="0.85" marker-end="url(#fbtip)"/>

  <!-- table mounts -->
  <g stroke="#4a5fd0" stroke-width="2" stroke-opacity="0.35">
    <line x1="364" y1="178" x2="364" y2="200"/><line x1="470" y1="178" x2="470" y2="200"/>
  </g>
</svg>
