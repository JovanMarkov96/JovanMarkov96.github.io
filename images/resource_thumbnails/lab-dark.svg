<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="AMO optics beamline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#041025"/><stop offset="1" stop-color="#020a18"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.2"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#7c8cff" stroke-opacity="0.08" stroke-width="1"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#15D5FF" flood-opacity="0.6"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <!-- beam path: laser -> lens -> mirror -> up to atoms -->
  <g stroke="#15D5FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <line x1="118" y1="250" x2="430" y2="250"/>
    <line x1="430" y1="250" x2="430" y2="120"/>
  </g>

  <!-- laser source -->
  <g fill="#06122a" stroke="#9fb0ff" stroke-width="2.4" filter="url(#glow)">
    <rect x="58" y="232" width="60" height="36" rx="5"/>
  </g>
  <line x1="70" y1="250" x2="106" y2="250" stroke="#8A5CF6" stroke-width="3"/>
  <text x="58" y="296" fill="#9fb0ff" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">laser</text>

  <!-- lens -->
  <g stroke="#9fb0ff" stroke-width="2.4" fill="none" filter="url(#glow)">
    <path d="M214 214 Q 232 250 214 286 Q 196 250 214 214 Z"/>
  </g>

  <!-- 45 deg mirror -->
  <line x1="412" y1="268" x2="448" y2="232" stroke="#9fb0ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- trapped atoms (glowing cloud) -->
  <g filter="url(#glow)">
    <circle cx="430" cy="104" r="22" fill="none" stroke="#8A5CF6" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="424" cy="100" r="4" fill="#15D5FF"/><circle cx="436" cy="106" r="4" fill="#6E8CFF"/>
    <circle cx="430" cy="112" r="4" fill="#8A5CF6"/><circle cx="438" cy="96" r="3" fill="#15D5FF"/>
  </g>
  <text x="464" y="110" fill="#9fb0ff" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">atoms</text>

  <!-- mounts -->
  <g stroke="#6E8CFF" stroke-width="2" stroke-opacity="0.4">
    <line x1="214" y1="286" x2="214" y2="320"/><line x1="430" y1="284" x2="430" y2="320"/>
  </g>
</svg>
