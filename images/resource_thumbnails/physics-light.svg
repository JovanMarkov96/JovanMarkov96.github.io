<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Physics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1fb"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#2E7CFF" stop-opacity="0.10"/><stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#2E7CFF" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#2E7CFF" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#halo)"/>

  <!-- central atom: three electron orbits + nucleus -->
  <g filter="url(#soft)" fill="none" stroke-width="2.4">
    <ellipse cx="232" cy="214" rx="92" ry="34" stroke="#2E7CFF" transform="rotate(28 232 214)"/>
    <ellipse cx="232" cy="214" rx="92" ry="34" stroke="#4a5fd0" transform="rotate(-28 232 214)"/>
    <ellipse cx="232" cy="214" rx="92" ry="34" stroke="#8A5CF6" transform="rotate(90 232 214)"/>
  </g>
  <circle cx="232" cy="214" r="11" fill="#2E7CFF" filter="url(#soft)"/>
  <circle cx="314" cy="190" r="6" fill="#8A5CF6"/>
  <circle cx="156" cy="250" r="6" fill="#0aa7c9"/>

  <!-- de Broglie / EM wave -->
  <path d="M392 328 Q 418 296 444 328 T 496 328 T 548 328 T 600 328" fill="none" stroke="#0aa7c9" stroke-width="2.4" stroke-opacity="0.85"/>

  <g font-family="Inter, 'Segoe UI', sans-serif" font-weight="700" font-style="italic">
    <!-- Newton's 2nd law (classical mechanics) -->
    <text x="138" y="116" fill="#8A5CF6" font-size="28" filter="url(#soft)">F = ma</text>
    <!-- Schrodinger equation (quantum mechanics) -->
    <text x="356" y="120" fill="#3a55d8" font-size="27" filter="url(#soft)">i&#8463; &#8706;&#968;/&#8706;t = &#292;&#968;</text>
    <!-- relativistic energy-momentum relation -->
    <text x="406" y="190" fill="#2E7CFF" font-size="27" filter="url(#soft)">E&#178; = (pc)&#178; + (mc&#178;)&#178;</text>
    <!-- Gauss's law (electromagnetism) -->
    <text x="404" y="248" fill="#4a5fd0" font-size="25" filter="url(#soft)">&#8711;&#183;E = &#961;/&#949;&#8320;</text>
    <!-- Boltzmann entropy (statistical mechanics) -->
    <text x="120" y="332" fill="#0aa7c9" font-size="26" filter="url(#soft)">S = k<tspan dy="6" font-size="17" font-style="normal">B</tspan><tspan dy="-6"> ln &#937;</tspan></text>
  </g>
</svg>
