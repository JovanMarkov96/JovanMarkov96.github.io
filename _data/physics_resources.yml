# ---------------------------------------------------------------------------
# Self-Study Resources for Physics — structured content.
# Drives /resources/physics-resources/ (see _resources/physics_self_study_resources.md).
# Content is preserved from the original page; only the presentation is new.
#
# Book links are intentionally neutral: each "Details" chip points to a Google
# Books search for the title + author so readers can find the book anywhere.
# Add an explicit `details:` to override, or `free:` for a legitimate free copy.
# ---------------------------------------------------------------------------

groups:
  - name: "Foundations"
    blurb: "The classical core every physicist builds on."
    topics:
      - id: "general-physics"
        name: "General Physics"
        icon: "general"
        tagline: "Big-picture introductions and the broad sweep of physics."
        books:
          - title: "The Feynman Lectures on Physics"
            by: "Richard P. Feynman, Robert B. Leighton & Matthew Sands"
            desc: "A comprehensive and engaging introduction to physics, covering a wide range of topics."
            free: "https://www.feynmanlectures.caltech.edu/"
          - title: "Fundamentals of Physics"
            by: "David Halliday, Robert Resnick & Jearl Walker"
            desc: "A widely used introductory textbook that covers a broad range of physics topics with clear explanations and examples."
          - title: "University Physics with Modern Physics"
            by: "Hugh D. Young & Roger A. Freedman"
            desc: "A comprehensive textbook that provides a thorough introduction to physics, including modern physics topics."
        videos:
          - name: "Physics Girl"
            url: "https://www.youtube.com/user/physicswoman"
            desc: "Engaging videos that explain various physics concepts in an accessible way."
          - name: "MinutePhysics"
            url: "https://www.youtube.com/user/minutephysics"
            desc: "Short and informative videos on a wide range of physics topics."
          - name: "Khan Academy Physics"
            url: "https://www.youtube.com/@khanacademyphysics7609"
            desc: "A wide range of physics tutorials and explanations, suitable for learners at all levels."
          - name: "Veritasium"
            url: "https://www.youtube.com/user/1veritasium"
            desc: "Engaging, well-produced videos that explore various physics concepts and phenomena."
          - name: "Sixty Symbols"
            url: "https://www.youtube.com/@sixtysymbols"
            desc: "Nottingham University professors discuss fascinating developments in physics research and concepts."
          - name: "Your Daily Equation with Brian Greene"
            url: "https://youtube.com/playlist?list=PLKy-B3Qf_RDVL6Z_CmgKf0tAbpXTua9mV"
            desc: "Brian Greene breaks down the most important equations in physics."
          - name: "Pretty Much Physics"
            url: "https://youtube.com/@prettymuchphysics"
            desc: "Short videos that cover a wide range of physics topics in an accessible manner."
        courses:
          - name: "MIT OpenCourseWare: Physics Courses"
            url: "https://ocw.mit.edu/search/?d=Physics&s=department_course_numbers.sort_coursenum"
            desc: "A collection of free lecture series on various physics topics from MIT."

      - id: "mathematical-methods"
        name: "Mathematical Methods"
        icon: "math-methods"
        tagline: "The mathematical toolkit of the working physicist."
        books:
          - title: "Group Theory in a Nutshell for Physicists"
            by: "A. Zee"
            desc: "Group theory taught with a physicist's instincts — finite and continuous groups, Lie groups and algebras, and representations — covering the symmetry tools that recur throughout quantum mechanics, particle physics, and field theory."

      - id: "classical-mechanics"
        name: "Classical Mechanics"
        icon: "mechanics"
        tagline: "Newtonian and Lagrangian dynamics of motion."
        books:
          - title: "Classical Mechanics"
            by: "Herbert Goldstein"
            desc: "A comprehensive textbook on classical mechanics, suitable for advanced undergraduates and graduate students."
          - title: "Classical Mechanics"
            by: "John R. Taylor"
            desc: "A well-written and accessible textbook on classical mechanics, suitable for beginners."
        notes:
          - name: "Classical Dynamics"
            url: "https://davidtong.org/teaching/classical-dynamics/"
            desc: "Lagrangian and Hamiltonian mechanics built up from Newton's laws, with rigid bodies and a first taste of chaos."
          - name: "Dynamics and Relativity"
            url: "https://davidtong.org/teaching/dynamics-and-relativity/"
            desc: "A gentle first course on Newtonian dynamics and gravitation, ending with the basics of special relativity."
        videos:
          - name: "Lectures by Walter Lewin"
            url: "https://www.youtube.com/playlist?list=PLyQSN7X0ro203puVhQsmCj9qhlFQ-As8e"
            desc: "A series of classical mechanics lectures by MIT professor Walter Lewin."
        courses:
          - name: "MIT OpenCourseWare: Classical Mechanics"
            url: "https://ocw.mit.edu/courses/physics/8-01sc-classical-mechanics-fall-2016/"
            desc: "A comprehensive course on classical mechanics from MIT."

      - id: "electromagnetism"
        name: "Electromagnetism"
        icon: "electromagnetism"
        tagline: "Fields, charges, and Maxwell's equations."
        books:
          - title: "Introduction to Electrodynamics"
            by: "David J. Griffiths"
            desc: "A widely used textbook for learning electromagnetism."
          - title: "Classical Electrodynamics"
            by: "John David Jackson"
            desc: "A comprehensive and advanced textbook on electromagnetism."
        notes:
          - name: "Electromagnetism"
            url: "https://davidtong.org/teaching/electromagnetism/"
            desc: "Maxwell's equations developed from scratch — electrostatics, magnetostatics, and electromagnetic waves, including a relativistic treatment."
        videos:
          - name: "Walter Lewin: 8.02 Electricity & Magnetism"
            url: "https://www.youtube.com/playlist?list=PLyQSN7X0ro203puVhQsmCj9qhlFQ-As8e"
            desc: "A series of electromagnetism lectures by MIT professor Walter Lewin."

      - id: "thermodynamics"
        name: "Thermodynamics & Statistical Mechanics"
        short: "Thermodynamics & Stat Mech"
        icon: "thermo"
        tagline: "Heat, entropy, and the statistics of many particles."
        books:
          - title: "Thermodynamics and an Introduction to Thermostatistics"
            by: "Herbert B. Callen"
            desc: "A comprehensive textbook on thermodynamics and statistical mechanics."
          - title: "Statistical Mechanics"
            by: "R. K. Pathria & Paul D. Beale"
            desc: "A widely used textbook for learning statistical mechanics."
        notes:
          - name: "Statistical Physics"
            url: "https://davidtong.org/teaching/statistical-physics/"
            desc: "Ensembles, entropy, and the laws of thermodynamics derived from statistical mechanics, through to phase transitions."
          - name: "Kinetic Theory"
            url: "https://davidtong.org/teaching/kinetic-theory/"
            desc: "Non-equilibrium statistical mechanics: the Boltzmann equation, transport phenomena, and the approach to equilibrium."
        videos:
          - name: "MIT OpenCourseWare: Thermodynamics"
            url: "https://www.youtube.com/user/MIT"
            desc: "Lectures on thermodynamics and statistical mechanics."

      - id: "optics"
        name: "Optics"
        icon: "optics"
        tagline: "Light, lenses, and wave phenomena."
        books:
          - title: "Optics"
            by: "Eugene Hecht"
            desc: "A comprehensive textbook on optics."
          - title: "Introduction to Modern Optics"
            by: "Grant R. Fowles"
            desc: "An accessible introduction to modern optics."
        videos:
          - name: "MinutePhysics: Optics"
            url: "https://www.youtube.com/user/minutephysics"
            desc: "Short and informative videos on optics topics."

  - name: "Quantum & Modern"
    blurb: "Into the quantum regime and the modern frontier."
    topics:
      - id: "quantum-mechanics"
        name: "Quantum Mechanics"
        icon: "quantum"
        tagline: "The wavefunction and the rules of the quantum world."
        books:
          - title: "Principles of Quantum Mechanics"
            by: "R. Shankar"
            desc: "A comprehensive and accessible textbook on quantum mechanics."
          - title: "Introduction to Quantum Mechanics"
            by: "David J. Griffiths"
            desc: "A widely used textbook for learning quantum mechanics, suitable for beginners."
          - title: "Quantum Mechanics"
            by: "Claude Cohen-Tannoudji, Bernard Diu & Frank Laloe"
            desc: "A comprehensive and detailed textbook, suitable for advanced undergraduates and graduate students."
        notes:
          - name: "Quantum Mechanics"
            url: "https://davidtong.org/teaching/quantum-mechanics/"
            desc: "A first course: the Schrodinger equation, Hilbert space, the harmonic oscillator, angular momentum, and the hydrogen atom."
          - name: "Topics in Quantum Mechanics"
            url: "https://davidtong.org/teaching/topics-in-quantum-mechanics/"
            desc: "A second course: scattering theory, perturbation theory, atomic physics, and the foundations of quantum mechanics."
        videos:
          - name: "Professor M does Science"
            url: "https://www.youtube.com/@ProfessorMdoesScience"
            desc: "Cambridge academics simplify university-level quantum mechanics with rigorous, concise, transparent explanations."
        courses:
          - name: "edX: Quantum Mechanics for Scientists and Engineers"
            url: "https://www.edx.org/course/quantum-mechanics-for-scientists-and-engineers-1"
            desc: "A course that provides a solid foundation in quantum mechanics."
          - name: "Coursera: Quantum Mechanics"
            url: "https://www.coursera.org/learn/quantum-mechanics"
            desc: "An introductory course on quantum mechanics."

      - id: "quantum-field-theory"
        name: "Quantum Field Theory"
        icon: "qft"
        tagline: "Where quantum mechanics meets special relativity."
        books:
          - title: "An Introduction to Quantum Field Theory"
            by: "Michael E. Peskin & Daniel V. Schroeder"
            desc: "A widely used textbook for learning quantum field theory."
          - title: "Quantum Field Theory for the Gifted Amateur"
            by: "Tom Lancaster & Stephen J. Blundell"
            desc: "An accessible introduction to quantum field theory."
          - title: "Quantum Field Theory in a Nutshell"
            by: "A. Zee"
            desc: "An accessible and comprehensive introduction to quantum field theory."
        notes:
          - name: "Quantum Field Theory"
            url: "https://davidtong.org/teaching/quantum-field-theory/"
            desc: "The canonical introduction: classical field theory, canonical quantization, Feynman diagrams, and quantum electrodynamics."
          - name: "Gauge Theory"
            url: "https://davidtong.org/teaching/gauge-theory/"
            desc: "Yang-Mills theory, instantons, anomalies, and the field-theoretic backbone of the Standard Model."
        videos:
          - name: "Physics Explained: QFT Series"
            url: "https://www.youtube.com/playlist?list=PLD08N-u68p_VZ7zP6O0P8kS2Gwa_D_Z_k"
            desc: "Clear explanations of quantum field theory concepts."
        courses:
          - name: "edX: Quantum Field Theory"
            url: "https://www.edx.org/course/quantum-field-theory"
            desc: "A course that provides a solid foundation in quantum field theory."
          - name: "Coursera: Introduction to Quantum Field Theory"
            url: "https://www.coursera.org/learn/quantum-field-theory"
            desc: "An introductory course on quantum field theory."

      - id: "quantum-optics"
        name: "Quantum Optics"
        icon: "quantum-optics"
        tagline: "Quantized light and its interaction with matter."
        books:
          - title: "Quantum Optics"
            by: "Marlan O. Scully & M. Suhail Zubairy"
            desc: "A comprehensive textbook on quantum optics."
          - title: "Introduction to Quantum Optics: From the Semi-Classical Approach to Quantized Light"
            by: "Gilbert Grynberg, Alain Aspect & Claude Fabre"
            desc: "An accessible introduction to quantum optics."
        videos:
          - name: "Quantum Optics Lab"
            url: "https://www.youtube.com/channel/UC5J6Zzj6k4J5p5k5Z5Z5Z5Q"
            desc: "Educational videos on quantum optics experiments and concepts."
          - name: "Physics Explained: Quantum Optics"
            url: "https://www.youtube.com/channel/UCtOgKmAM4MeFu-jd-HB3_cg"
            desc: "Clear explanations of quantum optics concepts."

      - id: "quantum-computing"
        name: "Quantum Computing"
        icon: "qcomputing"
        tagline: "Qubits, algorithms, and quantum information."
        books:
          - title: "Quantum Computation and Quantum Information"
            by: "Michael A. Nielsen & Isaac L. Chuang"
            desc: "A comprehensive textbook on quantum computing and quantum information."
          - title: "Quantum Computing: A Gentle Introduction"
            by: "Eleanor G. Rieffel & Wolfgang H. Polak"
            desc: "An accessible introduction to quantum computing for beginners."
        videos:
          - name: "Qiskit"
            url: "https://www.youtube.com/channel/UClBNq7mCMf5xm8baE_VMl3A"
            desc: "Tutorials and explanations on quantum computing using the Qiskit framework."
          - name: "Quantum Computing UK"
            url: "https://www.youtube.com/channel/UC4xKdmAXFh4ACyhpiQ_3qBw"
            desc: "Videos on various quantum computing topics and concepts."
        courses:
          - name: "edX: Quantum Computing"
            url: "https://www.edx.org/course/quantum-computing"
            desc: "A course that provides a solid foundation in quantum computing."
          - name: "Coursera: Introduction to Quantum Computing"
            url: "https://www.coursera.org/learn/quantum-computing"
            desc: "An introductory course on quantum computing."
        more:
          - name: "IBM Quantum"
            url: "https://quantum-computing.ibm.com/"
            desc: "An online platform to learn and experiment with quantum computing."
          - name: "Qiskit Documentation"
            url: "https://qiskit.org/documentation/"
            desc: "Comprehensive documentation and tutorials for learning quantum computing with Qiskit."

  - name: "Relativity & Fields"
    blurb: "Spacetime, gravity, and the field picture of nature."
    topics:
      - id: "special-relativity"
        name: "Special Relativity"
        icon: "special-relativity"
        tagline: "Spacetime, simultaneity, and the speed of light."
        books:
          - title: "Spacetime Physics"
            by: "Edwin F. Taylor & John Archibald Wheeler"
            desc: "A great introduction to special relativity, with clear explanations and plenty of examples."
          - title: "Introduction to Special Relativity"
            by: "James H. Smith"
            desc: "A concise and accessible textbook on special relativity."
          - title: "Introduction to Special Relativity"
            by: "Robert Resnick"
            desc: "A classic and accessible textbook on special relativity."
        notes:
          - name: "Dynamics and Relativity"
            url: "https://davidtong.org/teaching/dynamics-and-relativity/"
            desc: "Special relativity from first principles — Lorentz transformations, spacetime, and relativistic dynamics — built alongside Newtonian mechanics."
        videos:
          - name: "MinutePhysics: Relativity Series"
            url: "https://www.youtube.com/playlist?list=PLoaVOjvkzQtyjhV55wZcdicAz5KexgKvm"
            desc: "Short and informative videos on special relativity topics."

      - id: "general-relativity"
        name: "General Relativity"
        icon: "general-relativity"
        tagline: "Gravity as the curvature of spacetime."
        books:
          - title: "A First Course in General Relativity"
            by: "Bernard Schutz"
            desc: "A well-written and accessible textbook on general relativity."
          - title: "Gravitation"
            by: "Charles W. Misner, Kip S. Thorne & John Archibald Wheeler"
            desc: "A comprehensive and advanced textbook on general relativity."
          - title: "Einstein Gravity in a Nutshell"
            by: "A. Zee"
            desc: "A comprehensive and accessible textbook on general relativity."
        notes:
          - name: "General Relativity"
            url: "https://davidtong.org/teaching/general-relativity/"
            desc: "Differential geometry, the Einstein field equations, black holes, and gravitational waves."
        videos:
          - name: "PBS Space Time"
            url: "https://www.youtube.com/channel/UC7_gcs09iThXybpVgjHZ_7g"
            desc: "Explores various topics in general relativity and theoretical physics."
        courses:
          - name: "edX: General Relativity"
            url: "https://www.edx.org/course/general-relativity"
            desc: "A course that provides a solid foundation in general relativity."
          - name: "Coursera: Introduction to General Relativity"
            url: "https://www.coursera.org/learn/general-relativity"
            desc: "An introductory course on general relativity."

      - id: "classical-field-theory"
        name: "Classical Field Theory"
        icon: "field-theory"
        tagline: "Fields and Lagrangians before quantization."
        books:
          - title: "Classical Field Theory"
            by: "Francis E. Low"
            desc: "A comprehensive textbook on classical field theory."
          - title: "The Classical Theory of Fields"
            by: "Lev D. Landau & Evgeny M. Lifshitz"
            desc: "A classic textbook on classical field theory."
        videos:
          - name: "Physics Explained: Classical Field Theory"
            url: "https://www.youtube.com/playlist?list=PLD08N-u68p_W1L-yXlD_vLdZJ_RE6v0h_"
            desc: "Clear explanations of classical field theory concepts."

  - name: "Specialized"
    blurb: "Deep dives into matter, nuclei, particles, and the cosmos."
    topics:
      - id: "atomic-physics"
        name: "Atomic Physics"
        icon: "atomic"
        tagline: "Atoms, spectra, and light-matter interaction."
        books:
          - title: "Introduction to Atomic Spectra"
            by: "Harvey Elliott White"
            desc: "A comprehensive textbook on atomic spectra and atomic physics."
          - title: "The Physics of Atoms and Quanta"
            by: "Hermann Haken & Hans Christoph Wolf"
            desc: "An accessible introduction to atomic physics."
          - title: "Atomic Physics"
            by: "Christopher J. Foot"
            desc: "A comprehensive textbook, suitable for advanced undergraduates and graduate students."
        notes:
          - name: "Topics in Quantum Mechanics"
            url: "https://davidtong.org/teaching/topics-in-quantum-mechanics/"
            desc: "Includes a thorough chapter on atomic physics — fine and hyperfine structure, the Zeeman effect, and selection rules — alongside scattering and perturbation theory."
        videos:
          - name: "MIT OpenCourseWare: Atomic Physics"
            url: "https://www.youtube.com/user/MIT"
            desc: "Lectures on atomic physics."

      - id: "nuclear-physics"
        name: "Nuclear Physics"
        icon: "nuclear"
        tagline: "Inside the nucleus: structure, decay, and reactions."
        books:
          - title: "Introductory Nuclear Physics"
            by: "Kenneth S. Krane"
            desc: "A comprehensive textbook on nuclear physics."
          - title: "Theoretical Nuclear Physics"
            by: "John M. Blatt & Victor F. Weisskopf"
            desc: "A classic textbook on theoretical nuclear physics."
          - title: "Introduction to Nuclear Particle Physics"
            by: "A. Das & T. Ferbel"
            desc: "A comprehensive textbook on nuclear and particle physics."
        videos:
          - name: "MIT OpenCourseWare: Nuclear Engineering"
            url: "https://www.youtube.com/user/MIT"
            desc: "Lectures on nuclear physics."

      - id: "condensed-matter"
        name: "Condensed Matter Physics"
        icon: "condensed-matter"
        tagline: "Solids, crystals, and emergent collective behavior."
        books:
          - title: "Introduction to Solid State Physics"
            by: "Charles Kittel"
            desc: "A widely used textbook for learning condensed matter physics."
          - title: "Principles of Condensed Matter Physics"
            by: "Paul M. Chaikin & T. C. Lubensky"
            desc: "A comprehensive textbook on condensed matter physics."
          - title: "The Oxford Solid State Basics"
            by: "Steven H. Simon"
            desc: "An accessible introduction to solid state physics."
        notes:
          - name: "Solid State Physics"
            url: "https://davidtong.org/teaching/solid-state-physics/"
            desc: "Crystal lattices, band structure, electrons and phonons in solids, and the quantum theory of materials."
          - name: "The Quantum Hall Effect"
            url: "https://davidtong.org/teaching/quantum-hall-effect/"
            desc: "The integer and fractional quantum Hall effects, and an accessible doorway into topological phases of matter."
        videos:
          - name: "Physics Explained: Condensed Matter"
            url: "https://www.youtube.com/channel/UCtOgKmAM4MeFu-jd-HB3_cg"
            desc: "Clear explanations of condensed matter physics concepts."

      - id: "particle-physics"
        name: "Particle Physics"
        icon: "particle"
        tagline: "Elementary particles and the Standard Model."
        books:
          - title: "Introduction to Elementary Particles"
            by: "David Griffiths"
            desc: "A widely used textbook for learning particle physics."
          - title: "Quarks and Leptons: An Introductory Course in Modern Particle Physics"
            by: "Francis Halzen & Alan D. Martin"
            desc: "A comprehensive introduction to particle physics."
        notes:
          - name: "Particle Physics"
            url: "https://davidtong.org/teaching/particle-physics/"
            desc: "An introduction to the particles and symmetries of the subatomic world, building intuition before the full field theory."
          - name: "The Standard Model"
            url: "https://davidtong.org/teaching/standard-model/"
            desc: "Constructing the Standard Model: gauge symmetry, electroweak unification, and the Higgs mechanism."
        videos:
          - name: "Fermilab"
            url: "https://www.youtube.com/user/fermilab"
            desc: "Educational videos on particle physics and related topics."
          - name: "CERN"
            url: "https://www.youtube.com/user/CERNTV"
            desc: "Videos on particle physics research and experiments conducted at CERN."

      - id: "astrophysics"
        name: "Astrophysics & Cosmology"
        icon: "astro"
        tagline: "Stars, galaxies, and the evolution of the cosmos."
        books:
          - title: "An Introduction to Modern Astrophysics"
            by: "Bradley W. Carroll & Dale A. Ostlie"
            desc: "A comprehensive textbook on astrophysics."
          - title: "Cosmology"
            by: "Steven Weinberg"
            desc: "A comprehensive textbook on cosmology."
        notes:
          - name: "Cosmology"
            url: "https://davidtong.org/teaching/cosmology/"
            desc: "The expanding universe, the thermal history of the Big Bang, and the growth of cosmic structure."
        videos:
          - name: "PBS Space Time: Astrophysics"
            url: "https://www.youtube.com/channel/UC7_gcs09iThXybpVgjHZ_7g"
            desc: "Explores various topics in astrophysics and cosmology."

# Primary literature — open-access journals & repositories.
journals:
  - name: "arXiv: Physics"
    url: "https://arxiv.org/archive/physics"
    desc: "A repository of open-access research papers across physics. Note: these papers are not peer-reviewed."
  - name: "Physical Review X"
    url: "https://journals.aps.org/prx/"
    desc: "An open-access journal that publishes original research in all areas of physics."
  - name: "New Journal of Physics"
    url: "https://iopscience.iop.org/journal/1367-2630"
    desc: "An open-access journal that covers all areas of physics."
  - name: "Journal of High Energy Physics"
    url: "https://link.springer.com/journal/13130"
    desc: "An open-access journal focusing on high energy physics, including particle physics, field theory, and quantum mechanics."
  - name: "Advances in Physics: X"
    url: "https://www.tandfonline.com/toc/tapx20/current"
    desc: "An open-access journal that publishes high-quality research across all areas of physics."
  - name: "Scientific Reports: Physics"
    url: "https://www.nature.com/srep/physics"
    desc: "An open-access journal that publishes research in all areas of physics."
  - name: "Frontiers in Physics"
    url: "https://www.frontiersin.org/journals/physics"
    desc: "An open-access journal that covers a wide range of topics in physics."
  - name: "EPJ Open"
    url: "https://epjopen.epj.org/"
    desc: "A series of open-access journals covering various fields of physics, including EPJ C (Particles and Fields) and EPJ D (Atomic, Molecular, Optical and Plasma Physics)."
  - name: "Physics Open"
    url: "https://www.journals.elsevier.com/physics-open"
    desc: "An open-access journal that publishes research in all areas of physics."
  - name: "npj Quantum Information"
    url: "https://www.nature.com/npjqi/"
    desc: "An open-access journal focusing on quantum information science and technology."
  - name: "Journal of Physics: Communications"
    url: "https://iopscience.iop.org/journal/2399-6528"
    desc: "An open-access journal that publishes high-quality research across all areas of physics."

# Handy tools & reference hubs.
tools:
  - name: "HyperPhysics"
    url: "http://hyperphysics.phy-astr.gsu.edu/"
    desc: "A comprehensive concept-map resource for learning various physics topics."
  - name: "Wolfram Alpha"
    url: "https://www.wolframalpha.com/"
    desc: "A powerful computational engine that helps with solving physics problems and visualizing concepts."
  - name: "Physics Forums"
    url: "https://www.physicsforums.com/"
    desc: "A community and resource hub for students and enthusiasts interested in physics."
