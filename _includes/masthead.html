{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">

    <!-- Brand -->
    <a class="site-title" href="{{ base_path }}/">{{ site.title }}</a>

    <!-- Primary navigation (centered on desktop, full-screen overlay on mobile) -->
    <nav id="site-nav" class="greedy-nav">
      <ul class="visible-links" id="nav-links">
        {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
        {% assign domain = '' %}
        {% else %}
        {% assign domain = base_path %}
        {% endif %}
        <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"{% if link.url != '/' and page.url contains link.url %} class="active"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>

    <!-- Actions: share, theme, mobile menu -->
    <div class="masthead__actions">
      <button id="share-toggle" class="nav-btn" aria-label="Share this page" title="Share">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

      <button id="ion-theme-toggle" class="nav-btn" aria-label="Toggle theme" title="System">
        <svg id="theme-icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </button>

      <button class="nav-toggle nav-btn" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span class="navicon"></span>
      </button>
    </div>
  </div>
</div>

<!-- Dimmed backdrop behind the mobile menu -->
<div class="nav-backdrop" id="nav-backdrop" hidden></div>

<script>
  (function() {
    var navToggle = document.getElementById('nav-toggle');
    var navLinks = document.getElementById('nav-links');
    var backdrop = document.getElementById('nav-backdrop');
    if (!navToggle || !navLinks) return;

    function setOpen(open) {
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      navToggle.classList.toggle('is-active', open);
      navLinks.classList.toggle('is-visible', open);
      if (backdrop) {
        if (open) backdrop.hidden = false;
        requestAnimationFrame(function () { backdrop.classList.toggle('is-visible', open); });
        if (!open) setTimeout(function () { if (!navLinks.classList.contains('is-visible')) backdrop.hidden = true; }, 300);
      }
      document.body.style.overflow = open ? 'hidden' : '';
    }

    navToggle.addEventListener('click', function () {
      setOpen(!navLinks.classList.contains('is-visible'));
    });
    if (backdrop) backdrop.addEventListener('click', function () { setOpen(false); });
    navLinks.addEventListener('click', function (e) {
      if (e.target.closest('a')) setOpen(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && navLinks.classList.contains('is-visible')) setOpen(false);
    });
  })();
</script>
