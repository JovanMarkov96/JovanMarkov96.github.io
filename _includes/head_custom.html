<!-- Early Theme Initialization to prevent FOUC -->
<script>
    (function () {
        var savedTheme = localStorage.getItem('theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = savedTheme === 'dark' || (!savedTheme && systemDark);
        if (isDark) {
            document.documentElement.classList.add('dark-mode');
        }
    })();
</script>

    /* Hide the "Follow" button on desktop since all links are visible */
    @media (min-width: 1024px) {

        /* Override obsolete Susy 12-column grid to use modern Flexbox */

            justify-content: space-between !important;
            align-items: flex-start !important;
            max-width: 1280px !important;
            margin: 120px auto 0 !important;
            padding-left: 2rem !important;
            padding-right: 2rem !important;

            width: 280px !important;
            max-width: 280px !important;

            /* Disconnect from the old float grid */
            float: none !important;
            flex-shrink: 0 !important;
            margin-right: 40px !important;
            margin-top: 0 !important;

            /* Make it sticky under the navbar with buffer */
            position: sticky !important;
            top: 110px !important;
        }

        .page {
            /* Take the rest of the available width cleanly */
            float: none !important;
            flex-grow: 1 !important;
            width: calc(100% - 320px) !important;
            /* Total minus sidebar + gap */
            max-width: 900px !important;
            /* Prevent text chunks from getting too wide to read comfortably */

    /* 6. CV Specific Overrides */
    .cv-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25em 0.75em;
        border-radius: 2em;
        font-size: 0.85em;
        font-weight: 500;
        margin: 0.25em;
        border: 1px solid var(--ion-border);
        background: var(--ion-surface-2);
        color: var(--ion-text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cv-badge:hover {
        transform: translateY(-1px);
        box-shadow: var(--ion-shadow-sm);
        border-color: var(--ion-accent);
    }

    .cv-badge i {
        margin-right: 0.4em;
        font-size: 1.1em;
    }

    .cv-section-icon {
        color: var(--ion-accent);
        opacity: 0.85;
        margin-right: 0.4rem;
        font-size: 0.9em;
        vertical-align: baseline;
    }

    .cv-timeline {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1.5rem;
        margin-bottom: 3rem;
    }

    .cv-timeline-item {
        display: flex;
        gap: 1.25rem;
        align-items: flex-start;
        background: var(--ion-surface-2);
        border: 1px solid var(--ion-border);
        border-radius: var(--ion-radius);
        padding: 1.25rem 1.5rem;
        transition: box-shadow 0.3s ease, transform 0.2s ease;
        cursor: pointer;
        position: relative;
    }

    .cv-timeline-item:hover {
        box-shadow: var(--ion-shadow-md);
        transform: translateY(-1px);
    }

    /* ===== Logo Circle (small, inline) ===== */
    .cv-logo {
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--ion-border);
        overflow: hidden;
        font-weight: bold;
        color: var(--ion-muted);
        font-size: 0.85rem;
        margin-top: 0.15rem;
    }

    .cv-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .cv-logo img[alt="Weizmann Institute of Science"] {
        width: 80%;
        height: 80%;
        object-fit: contain;
    }

    html.dark-mode .cv-logo {
        border: 2px solid rgba(var(--ion-accent-rgb), 0.25);
        box-shadow: 0 0 12px rgba(var(--ion-accent-rgb), 0.15);
    }

    /* ===== Entry Content ===== */
    .cv-content {
        flex-grow: 1;
        min-width: 0;
    }

    .cv-header-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .cv-content h3 {
        margin-top: 0;
        margin-bottom: 0.2rem;
        font-size: 1.15rem;
    }

    .cv-content .meta {
        color: var(--ion-muted);
        font-size: 0.85em;
        margin-bottom: 0;
    }

    /* ===== Hover Arrow (chevron) ===== */
    .cv-chevron {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        opacity: 0;
        transform: translateX(-4px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        color: var(--ion-muted);
        margin-top: 0.3rem;
        margin-left: auto;
    }

    .cv-timeline-item:hover .cv-chevron {
        opacity: 1;
        transform: translateX(0);
    }

    .cv-timeline-item.is-open .cv-chevron {
        opacity: 1;
        transform: translateX(0) rotate(90deg);
    }

    /* ===== Collapsible Details ===== */
    .cv-details {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        opacity: 0;
    }

    .cv-timeline-item.is-open .cv-details {
        opacity: 1;
    }

    .cv-details-inner {
        padding-top: 0.75rem;
        margin-top: 0.75rem;
        border-top: 1px solid var(--ion-border);
    }

    .cv-details-inner ul {
        margin-bottom: 0;
        padding-left: 1.2rem;
    }

    .cv-details ul {
        margin: 0;
        padding-left: 1.2rem;
        color: var(--ion-text);
        font-size: 0.95rem;
    }

    .cv-details li {
        margin-bottom: 0.4rem;
    }

    /* ===== Simple Structured Text Entries (e.g. Awards, Memberships) ===== */
    .cv-text-entry {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 1.5rem;
        margin-bottom: 1.25rem;
        align-items: baseline;
    }

    .cv-text-entry.has-category {
        grid-template-columns: 140px 100px 1fr;
    }

    @media (max-width: 600px) {
        .cv-text-entry,
        .cv-text-entry.has-category {
            grid-template-columns: 1fr;
            gap: 0.25rem;
            margin-bottom: 1.5rem;
        }
    }

    .cv-text-category {
        display: flex;
        /* Helps vertically align the pill if needed */
        align-items: center;
    }

    .cv-text-year {
        color: var(--ion-text);
        font-weight: 600;
        font-size: 0.95rem;
        opacity: 0.9;
    }

    .cv-text-content {
        color: var(--ion-text);
        font-size: 1rem;
        line-height: 1.5;
    }

    .cv-text-content strong {
        color: var(--ion-text);
        font-weight: 600;
        display: inline-block;
        margin-bottom: 0.2rem;
    }

    .cv-text-meta {
        color: var(--ion-muted);
        font-size: 0.85rem;
        display: block;
        margin-top: 0.1rem;
    }

    /* ===== Language Proficiency Bars ===== */
    .cv-language-list {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        margin-bottom: 2rem;
        max-width: 600px;
    }

    .cv-language-item {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }

    .cv-language-info {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .cv-language-name {
        color: var(--ion-text);
        font-weight: 600;
        font-size: 1rem;
    }

    .cv-language-level {
        color: var(--ion-muted);
        font-size: 0.85rem;
        font-weight: 500;
    }

    .cv-language-bar-bg {
        height: 6px;
        width: 100%;
        background-color: var(--ion-border);
        border-radius: 4px;
        overflow: hidden;
    }

    .cv-language-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--ion-accent), var(--ion-accent-hover));
        border-radius: 4px;
        transition: width 1s ease-out;
    }

    /* ===== 3D Keyboard Button Pills ===== */
    .cv-pill-container {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem 0.6rem;
        /* Extra vertical gap to account for 3D bottom height */
        margin-top: 0.5rem;
        margin-bottom: 2rem;
    }

    .cv-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.75rem;
        border-radius: 6px;
        /* Squarish with rounded edges like GitHub labels/keyboard keys */
        font-size: 0.85rem;
        font-weight: 600;
        color: white !important;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(0, 0, 0, 0.4);

        /* Glossy glare effect */
        background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 40%, rgba(0, 0, 0, 0.1) 100%);

        /* 3D button shadow */
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.3),
            /* Top inner glare */
            inset 0 -1px 0 rgba(0, 0, 0, 0.1),
            /* Bottom inner shadow */
            0 3px 0 rgba(0, 0, 0, 0.3),
            /* 3D depth */
            0 4px 4px rgba(0, 0, 0, 0.2);
        /* Soft drop shadow */

        transition: transform 0.1s ease, box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: default;
    }

    .cv-pill i {
        font-size: 1.05em;
    }

    /* Press down effect on hover */
    .cv-pill:hover {
        transform: translateY(2px);
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.2),
            inset 0 -1px 0 rgba(0, 0, 0, 0.1),
            0 1px 0 rgba(0, 0, 0, 0.3),
            /* Reduced depth */
            0 2px 2px rgba(0, 0, 0, 0.2);
        /* Closer drop shadow */
    }

    /* ===== Publications Grid/List Toggle ===== */
    .pub-view-toggle {
        display: flex;
        gap: 0.4rem;
        justify-content: flex-end;
        margin-bottom: 1.5rem;
    }

    .pub-toggle-btn {
        background: var(--ion-surface);
        border: 1px solid var(--ion-border);
        border-radius: 8px;
        padding: 0.45rem 0.7rem;
        cursor: pointer;
        color: var(--ion-muted);
        font-size: 1rem;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .pub-toggle-btn:hover {
        color: var(--ion-accent);
        border-color: var(--ion-accent);
    }

    .pub-toggle-btn.active {
        background: rgba(var(--ion-accent-rgb), 0.1);
        color: var(--ion-accent);
        border-color: var(--ion-accent);
    }

    html.dark-mode .pub-toggle-btn {
        background: rgba(var(--ion-dark-bg-rgb), 0.6);
        border-color: rgba(var(--ion-accent-rgb), 0.15);
    }

    html.dark-mode .pub-toggle-btn.active {
        background: rgba(var(--ion-accent-rgb), 0.15);
        border-color: rgba(var(--ion-accent-rgb), 0.4);
    }

    /* ===== Publications grid — reuses the .project-card component ===== */
    .pub-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.75rem;
        margin: 2.5rem 0 3rem;
        align-items: stretch;
    }
    .pub-grid > * { animation: shineRise 0.55s var(--shine-ease) backwards; }
    .pub-grid > *:nth-child(2) { animation-delay: 0.07s; }
    .pub-grid > *:nth-child(3) { animation-delay: 0.13s; }
    .pub-grid > *:nth-child(4) { animation-delay: 0.19s; }
    .pub-grid > *:nth-child(n+5) { animation-delay: 0.25s; }

    /* publication-specific bits layered on top of .project-card */
    .pub-venue {
        margin: 0 0 0.6rem;
        font-size: 0.82rem;
        color: var(--ion-muted);
    }
    .pub-venue i { color: var(--ion-muted); }

        flex-wrap: wrap;

        font-weight: 600;

                    box-shadow 0.25s var(--shine-ease),
                    background-color 0.25s ease,
                    border-color 0.25s ease,
                    color 0.25s ease;

    /* ===== Native Mobile Navbar Overlay ===== */
    @media (max-width: 1023px) {
        .masthead {
            z-index: 1000 !important;
        }
        
        button#nav-toggle {
            position: relative;
            z-index: 10001 !important; /* Always above the overlay */
        }
        
        button#nav-toggle .navicon,
        button#nav-toggle .navicon:before,
        button#nav-toggle .navicon:after {
            background: currentColor !important;
        }
        
        .visible-links {
            /* Full-screen overlay overriding the standard dropdown */
            position: fixed !important;
            top: -16px !important; /* Negates masthead 16px top offset */
            left: 50% !important; /* Centered relative to view */
            transform: translateX(-50%) !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 0 !important;
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(20px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            z-index: 9999 !important;
            
            /* Hidden state with transitions */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
            border: none !important;
            box-shadow: none !important;
        }

        .visible-links.is-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
