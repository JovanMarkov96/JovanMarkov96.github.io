{%- comment -%}
  Mathematics topic glyphs. Line-art on a 64x64 grid, drawn with
  stroke="currentColor" so they adapt to light/dark automatically (the
  container sets the accent color). Mirrors physics-topic-icon.html.
  Usage: {% include math-topic-icon.html icon="calculus" %}
{%- endcomment -%}
<svg class="phys-glyph" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-hidden="true">{% case include.icon %}{% when 'general-math' %}<circle cx="32" cy="14" r="3" fill="currentColor" stroke="none"/><path d="M31 16 20 47"/><path d="M33 16 44 47"/><path d="M20 47a14 11 0 0 0 24 0" stroke-opacity="0.45" stroke-dasharray="2.5 3"/><path d="M40 38l5 2 1 5" stroke-opacity="0.7"/>{% when 'calculus' %}<path d="M14 50H52" stroke-opacity="0.4"/><path d="M16 14V50" stroke-opacity="0.4"/><path d="M16 46C28 46 33 20 50 15"/><path d="M22 41 46 21" stroke-opacity="0.8"/><circle cx="34" cy="31" r="2.6" fill="currentColor" stroke="none"/>{% when 'linear-algebra' %}<path d="M23 16h-7v32h7"/><path d="M41 16h7v32h-7"/><g fill="currentColor" stroke="none"><circle cx="29" cy="26" r="2.5"/><circle cx="39" cy="26" r="2.5"/><circle cx="29" cy="38" r="2.5"/><circle cx="39" cy="38" r="2.5"/></g>{% when 'differential-equations' %}<g stroke-opacity="0.85"><path d="M14 22l6-3"/><path d="M30 21l6-1"/><path d="M46 21l6 1"/><path d="M14 34l6-1"/><path d="M30 34l6 1"/><path d="M46 35l6 3"/><path d="M14 47l6 1"/><path d="M30 47l6 3"/><path d="M46 48l6 4"/></g><path d="M12 50C28 42 30 24 52 14" stroke-opacity="0.5"/>{% when 'probability' %}<path d="M12 49H52" stroke-opacity="0.4"/><g fill="currentColor" fill-opacity="0.14" stroke-opacity="0.45"><rect x="18" y="40" width="6" height="9"/><rect x="26" y="32" width="6" height="17"/><rect x="34" y="26" width="6" height="23"/><rect x="42" y="34" width="6" height="15"/></g><path d="M12 47C25 47 24 21 32 21 40 21 39 47 52 47"/>{% when 'tools' %}<circle cx="32" cy="32" r="9"/><circle cx="32" cy="32" r="3" fill="currentColor" stroke="none"/><path d="M32 14v6M32 44v6M14 32h6M44 32h6M19.5 19.5l4.2 4.2M40.3 40.3l4.2 4.2M44.5 19.5l-4.2 4.2M23.7 40.3l-4.2 4.2"/>{% else %}<circle cx="32" cy="14" r="3" fill="currentColor" stroke="none"/><path d="M31 16 20 47"/><path d="M33 16 44 47"/>{% endcase %}</svg>
